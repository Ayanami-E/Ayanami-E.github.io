title: Peizhou Huang
tagline: Personal website of Peizhou Huang. Powered by Jekyll, based on the Minimal Mistakes theme.
description: Personal website of Peizhou Huang, MEng student in EECS at the University of Michigan, working on multimodal agents.

url: https://ayanami-e.github.io

# --------------------------------------------------
#  AUTHOR / PROFILE DATA
# --------------------------------------------------
owner:
  name: Peizhou Huang
  avatar: photo.png          # 把头像（正方形）放进 images/ 目录，命名 photo.jpg
  email: chimiyuzhe@gmail.com
  # cv: https://ayanami-e.github.io/file/CV.pdf

  github: Ayanami-E
  linkedin: peizhou-huang-6114b5383
  scholar: https://scholar.google.com/citations?user=LHMe_2cAAAAJ&hl=en
