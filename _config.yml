# --------------------------------------------------
#  SEARCH-ENGINE VERIFICATION & ANALYTICS
# --------------------------------------------------
# 原作者的统计 ID 已删除，避免你的流量进他账号
# google_verify: ""
# google_analytics: ""

# --------------------------------------------------
#  TOP NAVIGATION BAR
# --------------------------------------------------
links:
  - title: About Me
    url: /
  - title: Publications
    url: /publications/

# --------------------------------------------------
#  BUILD & RENDERING OPTIONS
# --------------------------------------------------
timezone: America/Detroit
future: true
highlighter: rouge

# --------------------------------------------------
#  PERMALINK STRUCTURE
# --------------------------------------------------
permalink: /:categories/:title

# --------------------------------------------------
#  KRAMDOWN SETTINGS
# --------------------------------------------------
kramdown:
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  enable_coderay: false

# --------------------------------------------------
#  DISQUS COMMENT SYSTEM
# --------------------------------------------------
# disqus:
#   shortname:

# --------------------------------------------------
#  INCLUDE / EXCLUDE Lists
# --------------------------------------------------
include: [".htaccess"]
exclude:
  - "backup"
  - "lib"
  - "config.rb"
  - "Capfile"
  - "config"
  - "log"
  - "Rakefile"
  - "Rakefile.rb"
  - "tmp"
  - "less"
  - "minimal-mistakes.sublime-project"
  - "minimal-mistakes.sublime-workspace"

# --------------------------------------------------
#  PLUG-INS
# --------------------------------------------------
plugins:
  - jekyll-feed
  - jekyll-sitemap
